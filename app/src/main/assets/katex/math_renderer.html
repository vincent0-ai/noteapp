<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<script src="marked.min.js"></script>
<style>
  :root {
    --bg-color: #ffffff;
    --text-color: #1a1a1a;
    --code-bg: #f5f5f5;
    --code-border: #e0e0e0;
    --blockquote-border: #e0e0e0;
    --blockquote-bg: #f9f9f9;
    --link-color: #1976d2;
    --heading-color: #1a1a1a;
    --hr-color: #e0e0e0;
    --table-border: #ddd;
    --table-header-bg: #f5f5f5;
    --table-stripe-bg: #fafafa;
  }
  .dark-theme {
    --bg-color: #1a1a1a;
    --text-color: #e0e0e0;
    --code-bg: #2a2a2a;
    --code-border: #3a3a3a;
    --blockquote-border: #3a3a3a;
    --blockquote-bg: #242424;
    --link-color: #64b5f6;
    --heading-color: #f0f0f0;
    --hr-color: #3a3a3a;
    --table-border: #3a3a3a;
    --table-header-bg: #2a2a2a;
    --table-stripe-bg: #222222;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 0;
    margin: 0;
    word-wrap: break-word;
    overflow-wrap: break-word;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  #content {
    padding: 0;
  }
  h1, h2, h3, h4, h5, h6 {
    color: var(--heading-color);
    margin: 0.8em 0 0.4em 0;
    font-weight: 600;
    line-height: 1.3;
  }
  h1 { font-size: 1.5em; }
  h2 { font-size: 1.3em; }
  h3 { font-size: 1.15em; }
  p { margin: 0.5em 0; }
  a { color: var(--link-color); text-decoration: none; }
  code {
    font-family: 'Fira Code', 'Source Code Pro', monospace;
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 3px;
    font-size: 0.9em;
    border: 1px solid var(--code-border);
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    margin: 0.8em 0;
  }
  pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.85em;
  }
  blockquote {
    border-left: 3px solid var(--blockquote-border);
    background: var(--blockquote-bg);
    padding: 8px 12px;
    margin: 0.5em 0;
    border-radius: 0 4px 4px 0;
  }
  ul, ol { padding-left: 1.5em; margin: 0.5em 0; }
  li { margin: 0.2em 0; }
  hr {
    border: none;
    border-top: 1px solid var(--hr-color);
    margin: 1em 0;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.8em 0;
    font-size: 0.9em;
  }
  th, td {
    border: 1px solid var(--table-border);
    padding: 6px 10px;
    text-align: left;
  }
  th {
    background: var(--table-header-bg);
    font-weight: 600;
  }
  tr:nth-child(even) td { background: var(--table-stripe-bg); }
  img { max-width: 100%; border-radius: 6px; }
  .katex-display {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 0;
    margin: 0.5em 0;
  }
  .katex { font-size: 1.1em; }
  /* Prevent KaTeX table styles from being affected */
  .katex table, .katex-display table { border: none; margin: 0; }
  .katex td, .katex th { border: none; padding: 0; background: none; }
</style>
</head>
<body>
<div id="content"></div>
<script>
function renderContent(rawText, isDark) {
  if (isDark) {
    document.documentElement.classList.add('dark-theme');
  } else {
    document.documentElement.classList.remove('dark-theme');
  }
  
  if (!rawText) {
    document.getElementById('content').innerHTML = '';
    return;
  }

  var processedText = rawText;

  // Protect code blocks
  var codePlaceholders = [];
  var mathPlaceholders = [];

  processedText = processedText.replace(/```[\s\S]*?```/g, function(match) {
    codePlaceholders.push(match);
    return '%%CODEBLOCK' + (codePlaceholders.length - 1) + '%%';
  });
  processedText = processedText.replace(/`[^`]+`/g, function(match) {
    codePlaceholders.push(match);
    return '%%CODEBLOCK' + (codePlaceholders.length - 1) + '%%';
  });

  // Render block math $$...$$
  processedText = processedText.replace(/\$\$([\s\S]*?)\$\$/g, function(match, math) {
    try {
      var rendered = katex.renderToString(math, { displayMode: true, throwOnError: false });
      mathPlaceholders.push(rendered);
      return '%%MATHBLOCK' + (mathPlaceholders.length - 1) + '%%';
    } catch(e) { return match; }
  });

  // Render inline math $...$
  processedText = processedText.replace(/\$([^\$\n]+?)\$/g, function(match, math) {
    try {
      var rendered = katex.renderToString(math, { displayMode: false, throwOnError: false });
      mathPlaceholders.push(rendered);
      return '%%MATHBLOCK' + (mathPlaceholders.length - 1) + '%%';
    } catch(e) { return match; }
  });

  // Restore code blocks before marked
  processedText = processedText.replace(/%%CODEBLOCK(\d+)%%/g, function(match, index) {
    return codePlaceholders[parseInt(index)] || match;
  });

  // Parse markdown
  if (typeof marked !== 'undefined') {
    // If marked is wrapped in a UMD bundle, it might be in marked.marked or just window.marked
    var parser = (typeof marked.marked === 'function') ? marked.marked : marked;
    processedText = parser(processedText, { breaks: true, gfm: true });
  }

  // Restore math
  processedText = processedText.replace(/%%MATHBLOCK(\d+)%%/g, function(match, index) {
    return mathPlaceholders[parseInt(index)] || match;
  });

  document.getElementById('content').innerHTML = processedText;
}
</script>
</body>
</html>
